<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Modern Login</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="main">
      <!-- Background overlay -->
      <div class="overlay"></div>

      <!-- Checkbox -->
      <input type="checkbox" id="chk" aria-hidden="true" />

      <!-- SIGN UP  -->

      <div class="signup">
        <form id="signupForm">
          <div class="logo">
            <i class="fa-solid fa-user-plus"></i>
          </div>

          <h1>Create Account</h1>

          <p class="subtitle">Join us and start your journey</p>

          <!-- Username -->
          <div class="input-box">
            <i class="fa-solid fa-user"></i>

            <input type="text" placeholder="Username" required />
          </div>

          <!-- Email -->
          <div class="input-box">
            <i class="fa-solid fa-envelope"></i>

            <input type="email" placeholder="Email Address" required />
          </div>

          <!-- Password -->
          <div class="input-box">
            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="signupPassword"
              placeholder="Password"
              required
            />

            <i
              class="fa-solid fa-eye password-eye"
              onclick="showPassword('signupPassword', this)"
            >
            </i>
          </div>

          <button type="submit">Create Account</button>

          <p class="switch-text">
            Already have an account?
            <label for="chk">Login</label>
          </p>
        </form>
      </div>

      <!--  LOGIN -->

      <div class="login">
        <form id="loginForm">
          <div class="logo login-logo">
            <i class="fa-solid fa-right-to-bracket"></i>
          </div>

          <h1>Welcome Back</h1>

          <p class="subtitle">Login to continue</p>

          <!-- Email -->
          <div class="input-box">
            <i class="fa-solid fa-envelope"></i>

            <input type="email" placeholder="Email Address" required />
          </div>

          <!-- Password -->
          <div class="input-box">
            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="loginPassword"
              placeholder="Password"
              required
            />

            <i
              class="fa-solid fa-eye password-eye"
              onclick="showPassword('loginPassword', this)"
            >
            </i>
          </div>

          <!-- Remember -->
          <div class="options">
            <label class="remember">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>

            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit">Login</button>

          <p class="switch-text">
            Don't have an account?
            <label for="chk">Sign Up</label>
          </p>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
